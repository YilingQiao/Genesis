<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genesis Web GUI</title>
  <style>
    :root {
      --bg-primary: #1a1a2e;
      --bg-sidebar: #16213e;
      --bg-card: #1e2a47;
      --bg-input: #0f1a30;
      --accent: #66b2c4;
      --accent-hover: #7fc8d8;
      --accent-dim: #3d7a8a;
      --text-primary: #e8e8f0;
      --text-secondary: #9a9ab0;
      --text-muted: #6a6a80;
      --border: #2a3a5c;
      --success: #4caf50;
      --danger: #e74c3c;
      --warning: #f39c12;
      --sidebar-width: 280px;
      --statusbar-height: 36px;
      --radius: 6px;
      --transition: 0.15s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ---- Status Bar ---- */
    #status-bar {
      height: var(--statusbar-height);
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 20px;
      font-size: 12px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      transition: background var(--transition);
    }

    .status-dot.connected {
      background: var(--success);
    }

    .status-label {
      color: var(--text-muted);
    }

    .status-value {
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }

    .status-paused {
      color: var(--warning);
      font-weight: 600;
      display: none;
    }

    .status-paused.visible {
      display: inline;
    }

    /* ---- Main Layout ---- */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ---- Sidebar ---- */
    #sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .sidebar-section {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    /* ---- Sim Controls ---- */
    .controls-row {
      display: flex;
      gap: 6px;
    }

    .btn {
      flex: 1;
      padding: 7px 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      text-align: center;
    }

    .btn:hover {
      background: var(--accent-dim);
      border-color: var(--accent);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn.active {
      background: var(--accent);
      color: var(--bg-primary);
      border-color: var(--accent);
    }

    /* ---- Tab Bar ---- */
    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 0;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      text-align: center;
      letter-spacing: 0.5px;
    }

    .tab-btn:hover {
      color: var(--text-secondary);
      background: rgba(102, 178, 196, 0.05);
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-panel {
      display: none;
      flex: 1;
      overflow-y: auto;
    }

    .tab-panel.active {
      display: flex;
      flex-direction: column;
    }

    .tab-panel::-webkit-scrollbar {
      width: 6px;
    }

    .tab-panel::-webkit-scrollbar-track {
      background: transparent;
    }

    .tab-panel::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    /* ---- Visualization Toggles ---- */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }

    .toggle-label {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .toggle-switch {
      position: relative;
      width: 34px;
      height: 18px;
      cursor: pointer;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 9px;
      transition: all var(--transition);
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      left: 2px;
      top: 2px;
      background: var(--text-secondary);
      border-radius: 50%;
      transition: all var(--transition);
    }

    .toggle-switch input:checked + .toggle-slider {
      background: var(--accent-dim);
      border-color: var(--accent);
    }

    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(16px);
      background: var(--accent);
    }

    /* ---- Range Slider Row ---- */
    .slider-row {
      padding: 4px 0;
    }

    .slider-row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .slider-row-value {
      font-size: 11px;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    /* ---- Entity Browser ---- */
    .entity-section {
      border-bottom: 1px solid var(--border);
    }

    .entity-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      cursor: pointer;
      transition: background var(--transition);
    }

    .entity-header:hover {
      background: rgba(102, 178, 196, 0.05);
    }

    .entity-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .entity-dofs {
      font-size: 11px;
      color: var(--text-muted);
    }

    .entity-arrow {
      font-size: 10px;
      color: var(--text-muted);
      transition: transform var(--transition);
    }

    .entity-arrow.open {
      transform: rotate(90deg);
    }

    .entity-body {
      display: none;
      padding: 0 16px 10px;
    }

    .entity-body.open {
      display: block;
    }

    .entity-controls {
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .entity-control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 0;
    }

    .entity-control-label {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .entity-select {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 11px;
      padding: 2px 6px;
      cursor: pointer;
      outline: none;
    }

    .entity-select:focus {
      border-color: var(--accent);
    }

    .entity-checkbox {
      width: 14px;
      height: 14px;
      cursor: pointer;
      accent-color: var(--accent);
    }

    .joint-row {
      margin-bottom: 8px;
    }

    .joint-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }

    .joint-name {
      font-size: 11px;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 160px;
    }

    .joint-value {
      font-size: 11px;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      min-width: 52px;
      text-align: right;
    }

    /* ---- Range Slider ---- */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: var(--bg-input);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg-sidebar);
      cursor: pointer;
      transition: transform var(--transition);
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg-sidebar);
      cursor: pointer;
    }

    /* ---- Number Input ---- */
    input[type="number"] {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 11px;
      padding: 3px 6px;
      width: 70px;
      outline: none;
      font-variant-numeric: tabular-nums;
      -moz-appearance: textfield;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      opacity: 1;
    }

    /* ---- Camera Controls ---- */
    .camera-group {
      margin-bottom: 8px;
    }

    .camera-group-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .camera-inputs {
      display: flex;
      gap: 4px;
    }

    .camera-input-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .camera-input-label {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .camera-input-wrapper input[type="number"] {
      width: 100%;
    }

    .camera-fov-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .camera-fov-row input[type="range"] {
      flex: 1;
    }

    .camera-fov-value {
      font-size: 11px;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      min-width: 32px;
      text-align: right;
    }

    .btn-reset-cam {
      width: 100%;
      padding: 6px 0;
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
    }

    .btn-reset-cam:hover {
      background: var(--accent-dim);
      border-color: var(--accent);
    }

    /* ---- Free Joint Mode Toggle ---- */
    .mode-toggle {
      display: flex;
      gap: 0;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .mode-toggle-btn {
      flex: 1;
      padding: 4px 0;
      border: none;
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      text-align: center;
    }

    .mode-toggle-btn.active {
      background: var(--accent-dim);
      color: var(--text-primary);
    }

    .mode-toggle-btn:hover:not(.active) {
      background: rgba(102, 178, 196, 0.1);
    }

    /* ---- Euler Input Group ---- */
    .euler-group {
      margin-bottom: 8px;
    }

    .euler-group-label {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .euler-inputs {
      display: flex;
      gap: 4px;
    }

    .euler-input-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .euler-input-label {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .euler-input-wrapper input[type="number"] {
      width: 100%;
    }

    /* ---- Multi-env Note ---- */
    .multi-env-note {
      color: var(--warning);
      font-size: 11px;
      padding: 4px 16px;
      display: none;
    }

    .multi-env-note.visible {
      display: block;
    }

    /* ---- Gizmo Controls ---- */
    .gizmo-toggle-btn {
      margin-left: 8px;
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      vertical-align: middle;
    }

    .gizmo-toggle-btn:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .gizmo-toggle-btn.active {
      background: var(--accent);
      color: var(--bg-primary);
      border-color: var(--accent);
    }

    .gizmo-mode-bar {
      display: none;
      gap: 0;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .gizmo-mode-btn {
      flex: 1;
      padding: 4px 0;
      border: none;
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      text-align: center;
    }

    .gizmo-mode-btn.active {
      background: var(--accent-dim);
      color: var(--text-primary);
    }

    .gizmo-mode-btn:hover:not(.active) {
      background: rgba(102, 178, 196, 0.1);
    }

    /* ---- Viewport ---- */
    #viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      background: var(--bg-primary);
    }

    #canvas {
      max-width: 100%;
      max-height: 100%;
      display: block;
      cursor: grab;
    }

    #canvas:active {
      cursor: grabbing;
    }

    #viewport-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--text-muted);
      font-size: 14px;
      pointer-events: none;
      text-align: center;
    }

    #viewport-overlay.hidden {
      display: none;
    }

    /* ---- Responsive: collapse sidebar on narrow screens ---- */
    @media (max-width: 700px) {
      #sidebar {
        position: absolute;
        left: 0;
        top: var(--statusbar-height);
        bottom: 0;
        z-index: 10;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }

      #sidebar.open {
        transform: translateX(0);
      }

      #sidebar-toggle {
        display: flex;
      }
    }

    #sidebar-toggle {
      display: none;
      position: absolute;
      top: 6px;
      left: 6px;
      z-index: 11;
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-sidebar);
      color: var(--text-primary);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- Status Bar -->
  <div id="status-bar">
    <div class="status-item">
      <span class="status-dot" id="conn-dot"></span>
      <span class="status-value" id="conn-text">Disconnected</span>
    </div>
    <div class="status-item">
      <span class="status-label">FPS</span>
      <span class="status-value" id="stat-fps">--</span>
    </div>
    <div class="status-item">
      <span class="status-label">Time</span>
      <span class="status-value" id="stat-time">--</span>
    </div>
    <div class="status-item">
      <span class="status-label">Step</span>
      <span class="status-value" id="stat-step">--</span>
    </div>
    <span class="status-paused" id="stat-paused">PAUSED</span>
  </div>

  <!-- Main Layout -->
  <div id="main">
    <!-- Sidebar Toggle (mobile) -->
    <button id="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>

    <!-- Sidebar -->
    <div id="sidebar">
      <div class="sidebar-header">
        <h1>GENESIS</h1>
      </div>

      <!-- Multi-env Note -->
      <div class="multi-env-note" id="multi-env-note"></div>

      <!-- Sim Controls -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Simulation</div>
        <div class="controls-row">
          <button class="btn" id="btn-play" title="Play">Play</button>
          <button class="btn" id="btn-step" title="Step">Step</button>
          <button class="btn" id="btn-reset" title="Reset">Reset</button>
        </div>
      </div>

      <!-- Tab Bar -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="vis">Visualization</button>
        <button class="tab-btn" data-tab="camera">Camera</button>
        <button class="tab-btn" data-tab="entities">Entities</button>
      </div>

      <!-- Tab: Visualization -->
      <div class="tab-panel active" id="tab-vis">
        <div class="sidebar-section">
          <div class="toggle-row" data-pyrender-only>
            <span class="toggle-label">Shadows</span>
            <label class="toggle-switch">
              <input type="checkbox" data-vis="shadows" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="toggle-row" data-pyrender-only>
            <span class="toggle-label">World Frame</span>
            <label class="toggle-switch">
              <input type="checkbox" data-vis="world_frame">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="toggle-row" data-pyrender-only>
            <span class="toggle-label">Link Frame</span>
            <label class="toggle-switch">
              <input type="checkbox" data-vis="link_frame">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="toggle-row" data-pyrender-only>
            <span class="toggle-label">Orthographic</span>
            <label class="toggle-switch">
              <input type="checkbox" data-vis="orthographic">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="slider-row" data-pyrender-only>
            <div class="slider-row-header">
              <span class="toggle-label">Link Frame Size</span>
              <span class="slider-row-value" id="link-frame-size-val">0.10</span>
            </div>
            <input type="range" id="link-frame-size" min="0.02" max="0.5" step="0.01" value="0.1">
          </div>
        </div>
      </div>

      <!-- Tab: Camera -->
      <div class="tab-panel" id="tab-camera">
        <div class="sidebar-section">
          <div class="camera-group">
            <div class="camera-group-label">Position</div>
            <div class="camera-inputs">
              <div class="camera-input-wrapper">
                <span class="camera-input-label">X</span>
                <input type="number" id="cam-pos-x" step="0.05" value="2.00">
              </div>
              <div class="camera-input-wrapper">
                <span class="camera-input-label">Y</span>
                <input type="number" id="cam-pos-y" step="0.05" value="2.00">
              </div>
              <div class="camera-input-wrapper">
                <span class="camera-input-label">Z</span>
                <input type="number" id="cam-pos-z" step="0.05" value="1.50">
              </div>
            </div>
          </div>
          <div class="camera-group">
            <div class="camera-group-label">Look At</div>
            <div class="camera-inputs">
              <div class="camera-input-wrapper">
                <span class="camera-input-label">X</span>
                <input type="number" id="cam-lookat-x" step="0.05" value="0.00">
              </div>
              <div class="camera-input-wrapper">
                <span class="camera-input-label">Y</span>
                <input type="number" id="cam-lookat-y" step="0.05" value="0.00">
              </div>
              <div class="camera-input-wrapper">
                <span class="camera-input-label">Z</span>
                <input type="number" id="cam-lookat-z" step="0.05" value="0.50">
              </div>
            </div>
          </div>
          <div class="camera-group">
            <div class="camera-group-label">Field of View</div>
            <div class="camera-fov-row">
              <input type="range" id="cam-fov" min="15" max="120" step="0.5" value="30">
              <span class="camera-fov-value" id="cam-fov-val">30.0</span>
            </div>
          </div>
          <button class="btn-reset-cam" id="btn-reset-cam">Reset Camera</button>
        </div>
      </div>

      <!-- Tab: Entities -->
      <div class="tab-panel" id="tab-entities">
        <div id="entity-browser"></div>
      </div>
    </div>

    <!-- Viewport -->
    <div id="viewport">
      <canvas id="canvas"></canvas>
      <div id="viewport-overlay">Waiting for frames...</div>
    </div>
  </div>

  <script>
    /* =======================================================
       Genesis Web GUI -- Single-file frontend
       ======================================================= */

    // ---- DOM References ----
    var canvas    = document.getElementById('canvas');
    var ctx       = canvas.getContext('2d');
    var overlay   = document.getElementById('viewport-overlay');
    var connDot   = document.getElementById('conn-dot');
    var connText  = document.getElementById('conn-text');
    var statFps   = document.getElementById('stat-fps');
    var statTime  = document.getElementById('stat-time');
    var statStep  = document.getElementById('stat-step');
    var statPaused = document.getElementById('stat-paused');
    var btnPlay   = document.getElementById('btn-play');
    var btnStep   = document.getElementById('btn-step');
    var btnReset  = document.getElementById('btn-reset');
    var entityBrowser = document.getElementById('entity-browser');
    var multiEnvNote = document.getElementById('multi-env-note');

    // Camera DOM
    var camPosX   = document.getElementById('cam-pos-x');
    var camPosY   = document.getElementById('cam-pos-y');
    var camPosZ   = document.getElementById('cam-pos-z');
    var camLookX  = document.getElementById('cam-lookat-x');
    var camLookY  = document.getElementById('cam-lookat-y');
    var camLookZ  = document.getElementById('cam-lookat-z');
    var camFov    = document.getElementById('cam-fov');
    var camFovVal = document.getElementById('cam-fov-val');
    var btnResetCam = document.getElementById('btn-reset-cam');

    // Link frame size
    var linkFrameSize = document.getElementById('link-frame-size');
    var linkFrameSizeVal = document.getElementById('link-frame-size-val');

    // ---- State ----
    var ws = null;
    var connected = false;
    var paused = false;
    var pendingFrame = null;
    var frameReceived = false;

    // Store scene_info entities for reference
    var sceneEntities = [];

    // Per-entity state: mode ('quat' or 'euler'), current euler values
    var entityState = {};

    // ---- FPS Counter ----
    var clientFps = 0;
    var frameCount = 0;
    var lastFpsTime = performance.now();

    // ---- Euler / Quaternion Helpers ----
    function eulerToQuat(rollDeg, pitchDeg, yawDeg) {
      var r = rollDeg * Math.PI / 180, p = pitchDeg * Math.PI / 180, y = yawDeg * Math.PI / 180;
      var cr = Math.cos(r / 2), sr = Math.sin(r / 2);
      var cp = Math.cos(p / 2), sp = Math.sin(p / 2);
      var cy = Math.cos(y / 2), sy = Math.sin(y / 2);
      return {
        w: cr * cp * cy + sr * sp * sy,
        x: sr * cp * cy - cr * sp * sy,
        y: cr * sp * cy + sr * cp * sy,
        z: cr * cp * sy - sr * sp * cy
      };
    }

    function quatToEuler(w, x, y, z) {
      var sinr = 2 * (w * x + y * z), cosr = 1 - 2 * (x * x + y * y);
      var roll = Math.atan2(sinr, cosr);
      var sinp = 2 * (w * y - z * x);
      var pitch = Math.abs(sinp) >= 1 ? Math.sign(sinp) * Math.PI / 2 : Math.asin(sinp);
      var siny = 2 * (w * z + x * y), cosy = 1 - 2 * (y * y + z * z);
      var yaw = Math.atan2(siny, cosy);
      return { roll: roll * 180 / Math.PI, pitch: pitch * 180 / Math.PI, yaw: yaw * 180 / Math.PI };
    }

    function normalizeQuat(qpos, quatStart, quatEnd) {
      var sum = 0;
      for (var i = quatStart; i < quatEnd; i++) sum += qpos[i] * qpos[i];
      var norm = Math.sqrt(sum);
      if (norm > 1e-8) {
        for (var i = quatStart; i < quatEnd; i++) qpos[i] /= norm;
      }
    }

    // ---- Gizmo State ----
    var gizmoEntityIdx = null;
    var gizmoMode = 'translate';
    var gizmoActiveAxis = null;
    var gizmoDragging = false;
    var gizmoLastMouseCanvas = null;
    var _bgCanvas = null;
    var _bgCtx = null;
    var GIZMO_SIZE_FACTOR = 0.15;
    var GIZMO_HIT_RADIUS = 14;

    // ---- Vector / Matrix Utilities ----
    function vec3Sub(a, b) { return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
    function vec3Add(a, b) { return [a[0]+b[0], a[1]+b[1], a[2]+b[2]]; }
    function vec3Scale(v, s) { return [v[0]*s, v[1]*s, v[2]*s]; }
    function vec3Dot(a, b) { return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
    function vec3Cross(a, b) { return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
    function vec3Len(v) { return Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]); }
    function vec3Norm(v) { var l=vec3Len(v); return l>1e-8?[v[0]/l,v[1]/l,v[2]/l]:[0,0,0]; }

    function buildViewMatrix(eye, target, up) {
      var f = vec3Norm(vec3Sub(target, eye));
      var s = vec3Norm(vec3Cross(f, up));
      var u = vec3Cross(s, f);
      return new Float64Array([
        s[0], u[0], -f[0], 0,
        s[1], u[1], -f[1], 0,
        s[2], u[2], -f[2], 0,
        -vec3Dot(s,eye), -vec3Dot(u,eye), vec3Dot(f,eye), 1
      ]);
    }

    function buildProjMatrix(fovRad, aspect, near, far) {
      var f = 1.0 / Math.tan(fovRad / 2.0);
      var nf = 1.0 / (near - far);
      return new Float64Array([
        f/aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far+near)*nf, -1,
        0, 0, 2*far*near*nf, 0
      ]);
    }

    function project3D(wp, vm, pm, w, h) {
      var vx = vm[0]*wp[0]+vm[4]*wp[1]+vm[8]*wp[2]+vm[12];
      var vy = vm[1]*wp[0]+vm[5]*wp[1]+vm[9]*wp[2]+vm[13];
      var vz = vm[2]*wp[0]+vm[6]*wp[1]+vm[10]*wp[2]+vm[14];
      var vw = vm[3]*wp[0]+vm[7]*wp[1]+vm[11]*wp[2]+vm[15];
      var cx = pm[0]*vx+pm[4]*vy+pm[8]*vz+pm[12]*vw;
      var cy = pm[1]*vx+pm[5]*vy+pm[9]*vz+pm[13]*vw;
      var cw = pm[3]*vx+pm[7]*vy+pm[11]*vz+pm[15]*vw;
      if (cw <= 0.001) return null;
      return [(cx/cw*0.5+0.5)*w, (1.0-(cy/cw*0.5+0.5))*h];
    }

    function ptSegDist(px, py, ax, ay, bx, by) {
      var dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
      if (l2 < 1e-8) return Math.hypot(px-ax, py-ay);
      var t = Math.max(0, Math.min(1, ((px-ax)*dx+(py-ay)*dy)/l2));
      return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
    }

    // ---- Quaternion Math for Gizmo ----
    function axisAngleToQuat(axis, angle) {
      var ha = angle / 2, s = Math.sin(ha);
      return { w: Math.cos(ha), x: axis[0]*s, y: axis[1]*s, z: axis[2]*s };
    }

    function quatMul(a, b) {
      return {
        w: a.w*b.w - a.x*b.x - a.y*b.y - a.z*b.z,
        x: a.w*b.x + a.x*b.w + a.y*b.z - a.z*b.y,
        y: a.w*b.y - a.x*b.z + a.y*b.w + a.z*b.x,
        z: a.w*b.z + a.x*b.y - a.y*b.x + a.z*b.w
      };
    }

    function quatNormalize(q) {
      var n = Math.sqrt(q.w*q.w + q.x*q.x + q.y*q.y + q.z*q.z);
      if (n < 1e-8) return { w: 1, x: 0, y: 0, z: 0 };
      return { w: q.w/n, x: q.x/n, y: q.y/n, z: q.z/n };
    }

    // ---- Gizmo Helpers ----
    var _gizmoVM = null, _gizmoPM = null;
    // Server-provided matrices (exact match with renderer)
    var _serverViewMat = null, _serverProjMat = null;

    function updateGizmoMatrices() {
      if (_serverViewMat && _serverProjMat) {
        // Use exact matrices from the server (matches pyrender's rendering)
        _gizmoVM = _serverViewMat;
        _gizmoPM = _serverProjMat;
      } else {
        // Fallback: reconstruct from pos/lookat (may have slight misalignment)
        var cp = [parseFloat(camPosX.value), parseFloat(camPosY.value), parseFloat(camPosZ.value)];
        var cl = [parseFloat(camLookX.value), parseFloat(camLookY.value), parseFloat(camLookZ.value)];
        var fov = parseFloat(camFov.value);
        var aspect = canvas.width / Math.max(canvas.height, 1);
        _gizmoVM = buildViewMatrix(cp, cl, [0, 0, 1]);
        _gizmoPM = buildProjMatrix(fov * Math.PI / 180, aspect, 0.05, 100);
      }
    }

    function getGizmoEntityPos() {
      if (gizmoEntityIdx === null) return null;
      var e = findEntity(gizmoEntityIdx);
      if (!e || !e.has_free_joint) return null;
      var q = e.qpos || [], s = e.free_joint_q_start || 0;
      return [q[s] || 0, q[s+1] || 0, q[s+2] || 0];
    }

    function getCanvasCoords(e) {
      var r = canvas.getBoundingClientRect();
      return [(e.clientX - r.left) * (canvas.width / r.width),
              (e.clientY - r.top) * (canvas.height / r.height)];
    }

    function ensureBgCanvas() {
      if (!_bgCanvas) { _bgCanvas = document.createElement('canvas'); _bgCtx = _bgCanvas.getContext('2d'); }
      if (_bgCanvas.width !== canvas.width || _bgCanvas.height !== canvas.height) {
        _bgCanvas.width = canvas.width;
        _bgCanvas.height = canvas.height;
      }
    }

    // ---- Gizmo Drawing ----
    var GIZMO_AXES = [
      { key: 'x', dir: [1,0,0], color: '#e74c3c' },
      { key: 'y', dir: [0,1,0], color: '#27ae60' },
      { key: 'z', dir: [0,0,1], color: '#2980b9' }
    ];

    function drawGizmo() {
      if (gizmoEntityIdx === null) return;
      var ePos = getGizmoEntityPos();
      if (!ePos) return;
      updateGizmoMatrices();
      var w = canvas.width, h = canvas.height;
      var center = project3D(ePos, _gizmoVM, _gizmoPM, w, h);
      if (!center) return;
      var cp = [parseFloat(camPosX.value), parseFloat(camPosY.value), parseFloat(camPosZ.value)];
      var dist = vec3Len(vec3Sub(cp, ePos));
      var axLen = dist * GIZMO_SIZE_FACTOR;

      if (gizmoMode === 'translate') {
        drawTranslateGizmo(ePos, center, axLen, w, h);
      } else {
        drawRotateGizmo(ePos, center, axLen, w, h);
      }
    }

    function drawTranslateGizmo(ePos, center, axLen, w, h) {
      GIZMO_AXES.forEach(function(ax) {
        var endW = vec3Add(ePos, vec3Scale(ax.dir, axLen));
        var end = project3D(endW, _gizmoVM, _gizmoPM, w, h);
        if (!end) return;
        var active = (gizmoActiveAxis === ax.key);
        var col = active ? '#ffffff' : ax.color;
        var lw = active ? 3.5 : 2.5;

        // Axis line
        ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(center[0], center[1]); ctx.lineTo(end[0], end[1]); ctx.stroke();

        // Arrowhead
        var dx = end[0] - center[0], dy = end[1] - center[1], a = Math.atan2(dy, dx);
        var hl = active ? 14 : 10;
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.moveTo(end[0], end[1]);
        ctx.lineTo(end[0] - hl * Math.cos(a - 0.4), end[1] - hl * Math.sin(a - 0.4));
        ctx.lineTo(end[0] - hl * Math.cos(a + 0.4), end[1] - hl * Math.sin(a + 0.4));
        ctx.closePath(); ctx.fill();

        // Label
        ctx.fillStyle = col; ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(ax.key.toUpperCase(), end[0] + 14 * Math.cos(a), end[1] + 14 * Math.sin(a));
      });

      // Center dot
      ctx.fillStyle = '#ffffff'; ctx.beginPath();
      ctx.arc(center[0], center[1], 4, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.stroke();
    }

    function drawRotateGizmo(ePos, center, radius, w, h) {
      GIZMO_AXES.forEach(function(ax) {
        var n = ax.dir;
        var u, v;
        if (Math.abs(n[2]) < 0.9) {
          u = vec3Norm(vec3Cross(n, [0, 0, 1]));
        } else {
          u = vec3Norm(vec3Cross(n, [0, 1, 0]));
        }
        v = vec3Cross(n, u);

        var active = (gizmoActiveAxis === ax.key);
        var col = active ? '#ffffff' : ax.color;
        ctx.strokeStyle = col;
        ctx.lineWidth = active ? 3 : 2;
        ctx.beginPath();
        var segs = 48, first = true;
        for (var i = 0; i <= segs; i++) {
          var angle = (i / segs) * Math.PI * 2;
          var pt = vec3Add(ePos, vec3Add(
            vec3Scale(u, Math.cos(angle) * radius),
            vec3Scale(v, Math.sin(angle) * radius)
          ));
          var sp = project3D(pt, _gizmoVM, _gizmoPM, w, h);
          if (!sp) { first = true; continue; }
          if (first) { ctx.moveTo(sp[0], sp[1]); first = false; }
          else ctx.lineTo(sp[0], sp[1]);
        }
        ctx.stroke();

        // Label at a fixed point on the circle
        var labelPt = vec3Add(ePos, vec3Scale(u, radius * 1.15));
        var lsp = project3D(labelPt, _gizmoVM, _gizmoPM, w, h);
        if (lsp) {
          ctx.fillStyle = col; ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(ax.key.toUpperCase(), lsp[0], lsp[1]);
        }
      });

      // Center dot
      ctx.fillStyle = '#ffffff'; ctx.beginPath();
      ctx.arc(center[0], center[1], 4, 0, Math.PI * 2); ctx.fill();
    }

    // ---- Gizmo Hit Testing ----
    function gizmoHitTest(cx, cy) {
      if (gizmoEntityIdx === null) return null;
      var ePos = getGizmoEntityPos();
      if (!ePos) return null;
      updateGizmoMatrices();
      var w = canvas.width, h = canvas.height;
      var center = project3D(ePos, _gizmoVM, _gizmoPM, w, h);
      if (!center) return null;
      var cp = [parseFloat(camPosX.value), parseFloat(camPosY.value), parseFloat(camPosZ.value)];
      var dist = vec3Len(vec3Sub(cp, ePos));
      var axLen = dist * GIZMO_SIZE_FACTOR;

      var best = null, bestD = GIZMO_HIT_RADIUS;

      if (gizmoMode === 'translate') {
        GIZMO_AXES.forEach(function(ax) {
          var endW = vec3Add(ePos, vec3Scale(ax.dir, axLen));
          var end = project3D(endW, _gizmoVM, _gizmoPM, w, h);
          if (!end) return;
          var d = ptSegDist(cx, cy, center[0], center[1], end[0], end[1]);
          if (d < bestD) { bestD = d; best = ax.key; }
        });
      } else {
        GIZMO_AXES.forEach(function(ax) {
          var n = ax.dir, u, v;
          if (Math.abs(n[2]) < 0.9) u = vec3Norm(vec3Cross(n, [0, 0, 1]));
          else u = vec3Norm(vec3Cross(n, [0, 1, 0]));
          v = vec3Cross(n, u);
          var segs = 48;
          for (var i = 0; i < segs; i++) {
            var a1 = (i / segs) * Math.PI * 2;
            var a2 = ((i + 1) / segs) * Math.PI * 2;
            var p1 = vec3Add(ePos, vec3Add(vec3Scale(u, Math.cos(a1) * axLen), vec3Scale(v, Math.sin(a1) * axLen)));
            var p2 = vec3Add(ePos, vec3Add(vec3Scale(u, Math.cos(a2) * axLen), vec3Scale(v, Math.sin(a2) * axLen)));
            var s1 = project3D(p1, _gizmoVM, _gizmoPM, w, h);
            var s2 = project3D(p2, _gizmoVM, _gizmoPM, w, h);
            if (!s1 || !s2) continue;
            var d = ptSegDist(cx, cy, s1[0], s1[1], s2[0], s2[1]);
            if (d < bestD) { bestD = d; best = ax.key; }
          }
        });
      }
      return best;
    }

    // ---- Gizmo Drag ----
    function gizmoStartDrag(axis, coords) {
      gizmoDragging = true;
      gizmoActiveAxis = axis;
      gizmoLastMouseCanvas = coords;
      canvas.style.cursor = 'crosshair';
    }

    function gizmoMoveDrag(coords) {
      if (!gizmoDragging || !gizmoActiveAxis) return;
      var entity = findEntity(gizmoEntityIdx);
      if (!entity) return;
      if (gizmoMode === 'translate') {
        gizmoMoveTranslate(entity, coords);
      } else {
        gizmoMoveRotate(entity, coords);
      }
      gizmoLastMouseCanvas = coords;
    }

    function gizmoMoveTranslate(entity, coords) {
      var ePos = getGizmoEntityPos();
      if (!ePos) return;
      updateGizmoMatrices();
      var w = canvas.width, h = canvas.height;

      var axDir;
      if (gizmoActiveAxis === 'x') axDir = [1, 0, 0];
      else if (gizmoActiveAxis === 'y') axDir = [0, 1, 0];
      else axDir = [0, 0, 1];

      // Project entity center and entity+axis to screen to get screen-space axis direction
      var sc = project3D(ePos, _gizmoVM, _gizmoPM, w, h);
      var se = project3D(vec3Add(ePos, axDir), _gizmoVM, _gizmoPM, w, h);
      if (!sc || !se) return;

      var sd = [se[0] - sc[0], se[1] - sc[1]];
      var sdl2 = sd[0] * sd[0] + sd[1] * sd[1];
      if (sdl2 < 1e-4) return;

      // Project mouse delta onto screen-space axis → world units
      var dx = coords[0] - gizmoLastMouseCanvas[0], dy = coords[1] - gizmoLastMouseCanvas[1];
      var worldDelta = (dx * sd[0] + dy * sd[1]) / sdl2;

      var qpos = (entity.qpos || []).slice();
      var qs = entity.free_joint_q_start || 0;
      if (gizmoActiveAxis === 'x') qpos[qs] += worldDelta;
      else if (gizmoActiveAxis === 'y') qpos[qs + 1] += worldDelta;
      else qpos[qs + 2] += worldDelta;

      entity.qpos = qpos;
      autoPause();
      send({ type: 'entity_update', entity_idx: gizmoEntityIdx, qpos: qpos,
             normalize_quats: true, quat_groups: entity.quat_groups || [] });
    }

    function gizmoMoveRotate(entity, coords) {
      var ePos = getGizmoEntityPos();
      if (!ePos) return;
      updateGizmoMatrices();
      var w = canvas.width, h = canvas.height;
      var center = project3D(ePos, _gizmoVM, _gizmoPM, w, h);
      if (!center) return;

      // Compute screen-space angle change
      var prevA = Math.atan2(gizmoLastMouseCanvas[1] - center[1], gizmoLastMouseCanvas[0] - center[0]);
      var currA = Math.atan2(coords[1] - center[1], coords[0] - center[0]);
      var delta = currA - prevA;
      if (delta > Math.PI) delta -= 2 * Math.PI;
      if (delta < -Math.PI) delta += 2 * Math.PI;

      var axDir;
      if (gizmoActiveAxis === 'x') axDir = [1, 0, 0];
      else if (gizmoActiveAxis === 'y') axDir = [0, 1, 0];
      else axDir = [0, 0, 1];

      // Flip rotation sign based on camera view direction relative to axis
      var cp = [parseFloat(camPosX.value), parseFloat(camPosY.value), parseFloat(camPosZ.value)];
      var cl = [parseFloat(camLookX.value), parseFloat(camLookY.value), parseFloat(camLookZ.value)];
      var viewDir = vec3Norm(vec3Sub(cl, cp));
      var sign = vec3Dot(viewDir, axDir) > 0 ? 1 : -1;

      var rotQ = axisAngleToQuat(axDir, delta * sign);
      var qpos = (entity.qpos || []).slice();
      var qs = entity.free_joint_q_start || 0;
      var curQ = { w: qpos[qs + 3] || 1, x: qpos[qs + 4] || 0, y: qpos[qs + 5] || 0, z: qpos[qs + 6] || 0 };
      var newQ = quatNormalize(quatMul(rotQ, curQ));
      qpos[qs + 3] = newQ.w; qpos[qs + 4] = newQ.x; qpos[qs + 5] = newQ.y; qpos[qs + 6] = newQ.z;

      entity.qpos = qpos;
      autoPause();
      send({ type: 'entity_update', entity_idx: gizmoEntityIdx, qpos: qpos,
             normalize_quats: true, quat_groups: entity.quat_groups || [] });
    }

    function gizmoEndDrag() {
      gizmoDragging = false;
      gizmoActiveAxis = null;
      gizmoLastMouseCanvas = null;
      canvas.style.cursor = 'grab';
    }

    function toggleGizmo(entityIdx) {
      gizmoEntityIdx = (gizmoEntityIdx === entityIdx) ? null : entityIdx;
      updateGizmoButtons();
    }

    function setGizmoMode(mode) {
      gizmoMode = mode;
      document.querySelectorAll('.gizmo-mode-btn').forEach(function(b) {
        b.classList.toggle('active', b.dataset.gizmoMode === mode);
      });
    }

    function updateGizmoButtons() {
      document.querySelectorAll('.gizmo-toggle-btn').forEach(function(btn) {
        var idx = parseInt(btn.dataset.entityIdx);
        btn.classList.toggle('active', idx === gizmoEntityIdx);
        btn.textContent = idx === gizmoEntityIdx ? 'Gizmo ON' : 'Gizmo';
      });
      document.querySelectorAll('.gizmo-mode-bar').forEach(function(bar) {
        var idx = parseInt(bar.dataset.entityIdx);
        bar.style.display = idx === gizmoEntityIdx ? 'flex' : 'none';
      });
    }

    // ---- WebSocket ----
    function connect() {
      var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(protocol + '//' + location.host + '/ws');
      ws.binaryType = 'arraybuffer';

      ws.onopen = function() {
        connected = true;
        connDot.classList.add('connected');
        connText.textContent = 'Connected';
      };

      ws.onclose = function() {
        connected = false;
        connDot.classList.remove('connected');
        connText.textContent = 'Disconnected';
        setTimeout(connect, 2000);
      };

      ws.onerror = function() {
        ws.close();
      };

      ws.onmessage = function(event) {
        if (event.data instanceof ArrayBuffer) {
          handleBinaryFrame(event.data);
        } else {
          handleJsonMessage(JSON.parse(event.data));
        }
      };
    }

    // ---- Binary Frame Handling ----
    function handleBinaryFrame(buffer) {
      var blob = new Blob([buffer], { type: 'image/jpeg' });
      createImageBitmap(blob).then(function(bitmap) {
        if (pendingFrame) {
          pendingFrame.close();
        }
        pendingFrame = bitmap;

        if (!frameReceived) {
          frameReceived = true;
          overlay.classList.add('hidden');
        }

        frameCount++;
      }).catch(function() {});
    }

    // ---- Render Loop ----
    function renderLoop() {
      if (pendingFrame) {
        if (canvas.width !== pendingFrame.width || canvas.height !== pendingFrame.height) {
          canvas.width = pendingFrame.width;
          canvas.height = pendingFrame.height;
        }
        ctx.drawImage(pendingFrame, 0, 0);
        pendingFrame.close();
        pendingFrame = null;

        // Save clean frame for gizmo overlay redraws
        if (gizmoEntityIdx !== null) {
          ensureBgCanvas();
          _bgCtx.drawImage(canvas, 0, 0);
        }
      } else if (gizmoEntityIdx !== null && _bgCanvas && _bgCanvas.width > 0) {
        // Restore clean frame before redrawing gizmo (avoids overdraw artifacts)
        ctx.drawImage(_bgCanvas, 0, 0);
      }

      // Draw gizmo overlay on top
      drawGizmo();

      var now = performance.now();
      if (now - lastFpsTime >= 1000) {
        clientFps = frameCount;
        frameCount = 0;
        lastFpsTime = now;
      }

      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    // ---- JSON Message Handling ----
    function handleJsonMessage(msg) {
      switch (msg.type) {
        case 'state_update':
          if (msg.time != null) statTime.textContent = msg.time.toFixed(3) + 's';
          if (msg.step != null) statStep.textContent = msg.step;
          if (msg.fps != null) {
            statFps.textContent = msg.fps.toFixed(0);
          } else {
            statFps.textContent = clientFps;
          }
          if (msg.paused != null) {
            paused = msg.paused;
            updatePlayButton();
            statPaused.classList.toggle('visible', paused);
          }
          if (msg.entities) {
            updateEntityStates(msg.entities);
          }
          // Sync camera state (skip if user is editing)
          if (msg.camera_state) {
            syncCameraInputs(msg.camera_state);
            // Store server-provided matrices for accurate gizmo rendering
            if (msg.camera_state.view_matrix) {
              _serverViewMat = new Float64Array(msg.camera_state.view_matrix);
            }
            if (msg.camera_state.proj_matrix) {
              _serverProjMat = new Float64Array(msg.camera_state.proj_matrix);
            }
          }
          break;

        case 'scene_info':
          // Multi-env note
          if (msg.n_envs && msg.n_envs > 1) {
            multiEnvNote.textContent = 'Note: Controlling env 0 of ' + msg.n_envs;
            multiEnvNote.classList.add('visible');
          } else {
            multiEnvNote.classList.remove('visible');
          }

          if (msg.entities) {
            sceneEntities = msg.entities;
            buildEntityBrowser(msg.entities);
          }

          // Sync visualization toggle states
          if (msg.vis_state) {
            document.querySelectorAll('[data-vis]').forEach(function(checkbox) {
              var key = checkbox.dataset.vis;
              if (msg.vis_state[key] != null) {
                checkbox.checked = msg.vis_state[key];
              }
            });
            // Sync link frame size slider
            if (msg.vis_state.link_frame_size != null) {
              linkFrameSize.value = msg.vis_state.link_frame_size;
              linkFrameSizeVal.textContent = parseFloat(msg.vis_state.link_frame_size).toFixed(2);
            }
          }

          // Init camera state
          if (msg.camera_state) {
            setCameraInputs(msg.camera_state);
          }

          break;
      }
    }

    // ---- Send Helper ----
    function send(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg));
      }
    }

      });

    camPosZ.addEventListener('change', sendCameraPos);

    function setCameraInputs(cam) {
      if (cam.pos) {
        camPosX.value = cam.pos[0].toFixed(2);
        camPosY.value = cam.pos[1].toFixed(2);
        camPosZ.value = cam.pos[2].toFixed(2);
      }
      if (cam.lookat) {
        camLookX.value = cam.lookat[0].toFixed(2);
        camLookY.value = cam.lookat[1].toFixed(2);
        camLookZ.value = cam.lookat[2].toFixed(2);
      }
      if (cam.fov != null) {
        camFov.value = cam.fov;
        camFovVal.textContent = parseFloat(cam.fov).toFixed(1);
      }
    }

    function syncCameraInputs(cam) {
      var active = document.activeElement;
      var camInputs = [camPosX, camPosY, camPosZ, camLookX, camLookY, camLookZ, camFov];
      // Skip sync if user is editing any camera input
      for (var i = 0; i < camInputs.length; i++) {
        if (active === camInputs[i]) return;
      }
      setCameraInputs(cam);
    }

    // ---- Camera Mouse Controls ----
    var isDragging = false;
    var isRightDrag = false;
    var lastMouseX = 0;
    var lastMouseY = 0;

    canvas.addEventListener('mousedown', function(e) {
      e.preventDefault();

      // Check gizmo interaction first (left click only)
      if (e.button === 0 && gizmoEntityIdx !== null) {
        var coords = getCanvasCoords(e);
        var hitAxis = gizmoHitTest(coords[0], coords[1]);
        if (hitAxis) {
          gizmoStartDrag(hitAxis, coords);
          return;
        }
      }

      isDragging = true;
      isRightDrag = (e.button === 2);
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    });

    window.addEventListener('mouseup', function() {
      if (gizmoDragging) {
        gizmoEndDrag();
        return;
      }
      isDragging = false;
      isRightDrag = false;
    });

    window.addEventListener('mousemove', function(e) {
      // Gizmo drag takes priority
      if (gizmoDragging) {
        var coords = getCanvasCoords(e);
        gizmoMoveDrag(coords);
        return;
      }

      // Gizmo hover highlighting (when not camera-dragging)
      if (gizmoEntityIdx !== null && !isDragging) {
        var coords = getCanvasCoords(e);
        var hit = gizmoHitTest(coords[0], coords[1]);
        gizmoActiveAxis = hit;
        canvas.style.cursor = hit ? 'pointer' : 'grab';
      }

      if (!isDragging) return;

      var dx = e.clientX - lastMouseX;
      var dy = e.clientY - lastMouseY;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;

      if (dx === 0 && dy === 0) return;

      var rect = canvas.getBoundingClientRect();
      var sensitivity = 2.0;

      if (isRightDrag) {
        send({
          type: 'camera_update',
          action: 'pan',
          dx: (dx / rect.width) * sensitivity,
          dy: (dy / rect.height) * sensitivity
        });
      } else {
        send({
          type: 'camera_update',
          action: 'orbit',
          d_azimuth: (dx / rect.width) * sensitivity,
          d_elevation: (dy / rect.height) * sensitivity
        });
      }
    });

    canvas.addEventListener('wheel', function(e) {
      e.preventDefault();
      var factor = e.deltaY > 0 ? 1.1 : 0.9;
      send({ type: 'camera_update', action: 'zoom', factor: factor });
    }, { passive: false });

    canvas.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });

    // ---- Entity Browser ----
    function buildEntityBrowser(entities) {
      entityBrowser.innerHTML = '';

      entities.forEach(function(entity, arrIdx) {
        var entityIdx = entity.idx != null ? entity.idx : arrIdx;
        var nDofs = entity.n_dofs || 0;
        var nQs = entity.n_qs || nDofs;
        var hasFreeJoint = entity.has_free_joint || false;
        var qNames = entity.q_names || [];
        var qLower = entity.q_limits_lower || [];
        var qUpper = entity.q_limits_upper || [];
        var qIsQuat = entity.q_is_quaternion || [];
        var quatGroups = entity.quat_groups || [];
        var freeJointQStart = entity.free_joint_q_start || 0;
        var qpos = entity.qpos || [];

        // Initialize entity state
        if (!entityState[entityIdx]) {
          entityState[entityIdx] = { mode: 'quat', euler: { roll: 0, pitch: 0, yaw: 0 } };
        }
        // Compute initial euler from qpos if free joint
        if (hasFreeJoint && quatGroups.length > 0) {
          var qg = quatGroups[0];
          var qw = qpos[qg[0]] || 1, qx = qpos[qg[0] + 1] || 0, qy = qpos[qg[0] + 2] || 0, qz = qpos[qg[0] + 3] || 0;
          entityState[entityIdx].euler = quatToEuler(qw, qx, qy, qz);
        }

        var section = document.createElement('div');
        section.className = 'entity-section';
        section.dataset.entityIdx = entityIdx;

        // Header
        var header = document.createElement('div');
        header.className = 'entity-header';
        header.innerHTML =
          '<div>' +
            '<span class="entity-name">' + escapeHtml(entity.name || ('Entity ' + entityIdx)) + '</span>' +
            '<span class="entity-dofs"> (' + nDofs + ' DOF' + (nQs !== nDofs ? ', ' + nQs + ' qs' : '') + ')</span>' +
            (hasFreeJoint ? '<button class="gizmo-toggle-btn" data-entity-idx="' + entityIdx + '">Gizmo</button>' : '') +
          '</div>' +
          '<span class="entity-arrow">&#9654;</span>';

        // Body container (replaces entity-joints)
        var body = document.createElement('div');
        body.className = 'entity-body';
        body.id = 'entity-body-' + entityIdx;

        // Toggle collapse
        header.addEventListener('click', function() {
          var arrow = header.querySelector('.entity-arrow');
          arrow.classList.toggle('open');
          body.classList.toggle('open');
        });

        // --- Entity Controls (vis mode, wireframe, contacts) ---
        var controls = document.createElement('div');
        controls.className = 'entity-controls';

        // Vis Mode dropdown
        var visModeRow = document.createElement('div');
        visModeRow.className = 'entity-control-row';
        visModeRow.dataset.pyrenderOnly = 'true';
        visModeRow.innerHTML =
          '<span class="entity-control-label">Vis Mode</span>' +
          '<select class="entity-select" data-entity-idx="' + entityIdx + '" data-prop="vis_mode">' +
            '<option value="visual"' + (entity.vis_mode === 'visual' ? ' selected' : '') + '>Visual</option>' +
            '<option value="collision"' + (entity.vis_mode === 'collision' ? ' selected' : '') + '>Collision</option>' +
          '</select>';
        controls.appendChild(visModeRow);

        // Wireframe checkbox
        var wireRow = document.createElement('div');
        wireRow.className = 'entity-control-row';
        wireRow.dataset.pyrenderOnly = 'true';
        wireRow.innerHTML =
          '<span class="entity-control-label">Wireframe</span>' +
          '<input type="checkbox" class="entity-checkbox" data-entity-idx="' + entityIdx + '" data-prop="wireframe">';
        controls.appendChild(wireRow);

        // Show Contacts checkbox
        var contactRow = document.createElement('div');
        contactRow.className = 'entity-control-row';
        contactRow.innerHTML =
          '<span class="entity-control-label">Show Contacts</span>' +
          '<input type="checkbox" class="entity-checkbox" data-entity-idx="' + entityIdx + '" data-prop="contact_viz"' +
          (entity.visualize_contact ? ' checked' : '') + '>';
        controls.appendChild(contactRow);

        body.appendChild(controls);

        // --- Gizmo Mode Bar (for free-joint entities) ---
        if (hasFreeJoint) {
          var gizmoBar = document.createElement('div');
          gizmoBar.className = 'gizmo-mode-bar';
          gizmoBar.dataset.entityIdx = entityIdx;
          gizmoBar.innerHTML =
            '<button class="gizmo-mode-btn active" data-gizmo-mode="translate">Translate</button>' +
            '<button class="gizmo-mode-btn" data-gizmo-mode="rotate">Rotate</button>';
          body.appendChild(gizmoBar);
        }

        // --- Joint Controls ---
        if (nQs > 0) {
          var jointsDiv = document.createElement('div');
          jointsDiv.className = 'entity-joints-container';
          jointsDiv.id = 'entity-joints-' + entityIdx;

          if (hasFreeJoint) {
            // Mode toggle (Euler / Quaternion)
            var modeDiv = document.createElement('div');
            modeDiv.className = 'mode-toggle';
            modeDiv.id = 'mode-toggle-' + entityIdx;
            modeDiv.innerHTML =
              '<button class="mode-toggle-btn active" data-mode="quat" data-entity-idx="' + entityIdx + '">Quaternion</button>' +
              '<button class="mode-toggle-btn" data-mode="euler" data-entity-idx="' + entityIdx + '">Euler</button>';
            jointsDiv.appendChild(modeDiv);

            // Quaternion mode container
            var quatContainer = document.createElement('div');
            quatContainer.id = 'quat-mode-' + entityIdx;
            buildQuatModeSliders(quatContainer, entity, entityIdx, qNames, qLower, qUpper, qIsQuat, qpos);
            jointsDiv.appendChild(quatContainer);

            // Euler mode container (hidden by default)
            var eulerContainer = document.createElement('div');
            eulerContainer.id = 'euler-mode-' + entityIdx;
            eulerContainer.style.display = 'none';
            buildEulerModeInputs(eulerContainer, entity, entityIdx, qNames, qLower, qUpper, qIsQuat, quatGroups, freeJointQStart, qpos);
            jointsDiv.appendChild(eulerContainer);
          } else {
            // No free joint: standard sliders
            buildStandardSliders(jointsDiv, entity, entityIdx, qNames, qLower, qUpper, qpos);
          }

          body.appendChild(jointsDiv);
        }

        section.appendChild(header);
        section.appendChild(body);
        entityBrowser.appendChild(section);
      });

      // Attach event listeners
      attachEntityControlListeners();
      attachModeToggleListeners();
      attachSliderListeners();
      attachQuatInputListeners();
      attachEulerInputListeners();
      attachGizmoListeners();
    }

    // Build sliders for quat mode (all q components shown as sliders/inputs)
    function buildQuatModeSliders(container, entity, entityIdx, qNames, qLower, qUpper, qIsQuat, qpos) {
      for (var i = 0; i < (entity.n_qs || 0); i++) {
        var name = qNames[i] || ('q' + i);
        var lo = qLower[i] != null ? qLower[i] : -3.14;
        var hi = qUpper[i] != null ? qUpper[i] : 3.14;
        var cur = qpos[i] != null ? qpos[i] : 0;
        var isQuat = qIsQuat[i] || false;

        var row = document.createElement('div');
        row.className = 'joint-row';

        if (isQuat) {
          // Quaternion component: number input
          row.innerHTML =
            '<div class="joint-info">' +
              '<span class="joint-name" title="' + escapeHtml(name) + '">' + escapeHtml(name) + '</span>' +
              '<span class="joint-value" id="jval-' + entityIdx + '-' + i + '">' + cur.toFixed(3) + '</span>' +
            '</div>' +
            '<input type="number"' +
              ' class="quat-input"' +
              ' data-entity-idx="' + entityIdx + '"' +
              ' data-q-idx="' + i + '"' +
              ' min="-1" max="1" step="0.01"' +
              ' value="' + cur.toFixed(4) + '"' +
              ' style="width:100%"' +
            '>';
        } else {
          // Regular DOF: range slider
          row.innerHTML =
            '<div class="joint-info">' +
              '<span class="joint-name" title="' + escapeHtml(name) + '">' + escapeHtml(name) + '</span>' +
              '<span class="joint-value" id="jval-' + entityIdx + '-' + i + '">' + cur.toFixed(3) + '</span>' +
            '</div>' +
            '<input type="range"' +
              ' class="joint-slider"' +
              ' data-entity-idx="' + entityIdx + '"' +
              ' data-q-idx="' + i + '"' +
              ' min="' + lo + '"' +
              ' max="' + hi + '"' +
              ' step="0.001"' +
              ' value="' + cur + '"' +
            '>';
        }

        container.appendChild(row);
      }
    }

    // Build euler mode inputs (position + euler angles + remaining joints)
    function buildEulerModeInputs(container, entity, entityIdx, qNames, qLower, qUpper, qIsQuat, quatGroups, freeJointQStart, qpos) {
      // Free joint: first 3 qs are position, next 4 are quaternion (w,x,y,z)
      // Position inputs
      var posGroup = document.createElement('div');
      posGroup.className = 'euler-group';
      posGroup.innerHTML = '<div class="euler-group-label">Position</div>';
      var posInputs = document.createElement('div');
      posInputs.className = 'euler-inputs';
      var posLabels = ['X', 'Y', 'Z'];
      for (var p = 0; p < 3; p++) {
        var qIdx = freeJointQStart + p;
        var cur = qpos[qIdx] != null ? qpos[qIdx] : 0;
        var wrapper = document.createElement('div');
        wrapper.className = 'euler-input-wrapper';
        wrapper.innerHTML =
          '<span class="euler-input-label">' + posLabels[p] + '</span>' +
          '<input type="number" class="euler-pos-input"' +
          ' data-entity-idx="' + entityIdx + '"' +
          ' data-q-idx="' + qIdx + '"' +
          ' step="0.05" min="-10" max="10"' +
          ' value="' + cur.toFixed(2) + '">';
        posInputs.appendChild(wrapper);
      }
      posGroup.appendChild(posInputs);
      container.appendChild(posGroup);

      // Euler angle inputs
      var eulerGroup = document.createElement('div');
      eulerGroup.className = 'euler-group';
      eulerGroup.innerHTML = '<div class="euler-group-label">Rotation (degrees)</div>';
      var eulerInputs = document.createElement('div');
      eulerInputs.className = 'euler-inputs';
      var eulerLabels = ['Roll', 'Pitch', 'Yaw'];
      var eulerKeys = ['roll', 'pitch', 'yaw'];
      var st = entityState[entityIdx];
      for (var e = 0; e < 3; e++) {
        var wrapper = document.createElement('div');
        wrapper.className = 'euler-input-wrapper';
        wrapper.innerHTML =
          '<span class="euler-input-label">' + eulerLabels[e] + '</span>' +
          '<input type="number" class="euler-angle-input"' +
          ' data-entity-idx="' + entityIdx + '"' +
          ' data-euler-key="' + eulerKeys[e] + '"' +
          ' step="1" min="-360" max="360"' +
          ' value="' + st.euler[eulerKeys[e]].toFixed(1) + '">';
        eulerInputs.appendChild(wrapper);
      }
      eulerGroup.appendChild(eulerInputs);
      container.appendChild(eulerGroup);

      // Remaining non-free joints (skip position and quaternion components)
      var freeQEnd = freeJointQStart + 7; // 3 pos + 4 quat
      for (var i = 0; i < (entity.n_qs || 0); i++) {
        if (i >= freeJointQStart && i < freeQEnd) continue;
        var name = qNames[i] || ('q' + i);
        var lo = qLower[i] != null ? qLower[i] : -3.14;
        var hi = qUpper[i] != null ? qUpper[i] : 3.14;
        var cur = qpos[i] != null ? qpos[i] : 0;

        var row = document.createElement('div');
        row.className = 'joint-row';
        row.innerHTML =
          '<div class="joint-info">' +
            '<span class="joint-name" title="' + escapeHtml(name) + '">' + escapeHtml(name) + '</span>' +
            '<span class="joint-value" id="euler-jval-' + entityIdx + '-' + i + '">' + cur.toFixed(3) + '</span>' +
          '</div>' +
          '<input type="range"' +
            ' class="euler-joint-slider"' +
            ' data-entity-idx="' + entityIdx + '"' +
            ' data-q-idx="' + i + '"' +
            ' min="' + lo + '"' +
            ' max="' + hi + '"' +
            ' step="0.001"' +
            ' value="' + cur + '"' +
          '>';
        container.appendChild(row);
      }
    }

    // Build standard sliders (no free joint)
    function buildStandardSliders(container, entity, entityIdx, qNames, qLower, qUpper, qpos) {
      var nQs = entity.n_qs || entity.n_dofs || 0;
      for (var i = 0; i < nQs; i++) {
        var name = qNames[i] || ('DOF ' + i);
        var lo = qLower[i] != null ? qLower[i] : -3.14;
        var hi = qUpper[i] != null ? qUpper[i] : 3.14;
        var cur = qpos[i] != null ? qpos[i] : 0;

        var row = document.createElement('div');
        row.className = 'joint-row';
        row.innerHTML =
          '<div class="joint-info">' +
            '<span class="joint-name" title="' + escapeHtml(name) + '">' + escapeHtml(name) + '</span>' +
            '<span class="joint-value" id="jval-' + entityIdx + '-' + i + '">' + cur.toFixed(3) + '</span>' +
          '</div>' +
          '<input type="range"' +
            ' class="joint-slider"' +
            ' data-entity-idx="' + entityIdx + '"' +
            ' data-q-idx="' + i + '"' +
            ' min="' + lo + '"' +
            ' max="' + hi + '"' +
            ' step="0.001"' +
            ' value="' + cur + '"' +
          '>';
        container.appendChild(row);
      }
    }

    // ---- Mode Toggle Listeners (Euler/Quat) ----
    function attachModeToggleListeners() {
      entityBrowser.querySelectorAll('.mode-toggle-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var eidx = parseInt(this.dataset.entityIdx);
          var mode = this.dataset.mode;
          entityState[eidx].mode = mode;

          // Update button active state
          var toggle = document.getElementById('mode-toggle-' + eidx);
          toggle.querySelectorAll('.mode-toggle-btn').forEach(function(b) {
            b.classList.toggle('active', b.dataset.mode === mode);
          });

          // Show/hide containers
          var quatDiv = document.getElementById('quat-mode-' + eidx);
          var eulerDiv = document.getElementById('euler-mode-' + eidx);
          if (mode === 'euler') {
            quatDiv.style.display = 'none';
            eulerDiv.style.display = 'block';
          } else {
            quatDiv.style.display = 'block';
            eulerDiv.style.display = 'none';
          }
        });
      });
    }

    // ---- Debounced Slider Input ----
    var sliderTimers = {};

    function attachSliderListeners() {
      entityBrowser.querySelectorAll('.joint-slider').forEach(function(slider) {
        slider.addEventListener('input', function() {
          var entityIdx = parseInt(this.dataset.entityIdx);
          var qIdx = parseInt(this.dataset.qIdx);
          var value = parseFloat(this.value);

          var valEl = document.getElementById('jval-' + entityIdx + '-' + qIdx);
          if (valEl) valEl.textContent = value.toFixed(3);

          autoPause();

          var key = entityIdx + '-' + qIdx;
          if (!sliderTimers[key]) {
            sliderTimers[key] = setTimeout(function() {
              send({
                type: 'entity_update',
                entity_idx: entityIdx,
                dof_idx: qIdx,
                value: value
              });
              sliderTimers[key] = null;
            }, 50);
          }
        });
      });

      // Euler mode remaining joint sliders
      entityBrowser.querySelectorAll('.euler-joint-slider').forEach(function(slider) {
        slider.addEventListener('input', function() {
          var entityIdx = parseInt(this.dataset.entityIdx);
          var qIdx = parseInt(this.dataset.qIdx);
          var value = parseFloat(this.value);

          var valEl = document.getElementById('euler-jval-' + entityIdx + '-' + qIdx);
          if (valEl) valEl.textContent = value.toFixed(3);

          autoPause();

          var key = 'euler-' + entityIdx + '-' + qIdx;
          if (!sliderTimers[key]) {
            sliderTimers[key] = setTimeout(function() {
              send({
                type: 'entity_update',
                entity_idx: entityIdx,
                dof_idx: qIdx,
                value: value
              });
              sliderTimers[key] = null;
            }, 50);
          }
        });
      });
    }

    // ---- Quaternion Input Listeners ----
    function attachQuatInputListeners() {
      entityBrowser.querySelectorAll('.quat-input').forEach(function(input) {
        input.addEventListener('change', function() {
          var entityIdx = parseInt(this.dataset.entityIdx);
          var qIdx = parseInt(this.dataset.qIdx);
          var value = parseFloat(this.value);

          // Find this entity's info
          var entity = findEntity(entityIdx);
          if (!entity) return;

          autoPause();

          // Build full qpos, update this component
          var qpos = (entity.qpos || []).slice();
          qpos[qIdx] = value;

          // Normalize quaternion groups
          var quatGroups = entity.quat_groups || [];
          for (var g = 0; g < quatGroups.length; g++) {
            normalizeQuat(qpos, quatGroups[g][0], quatGroups[g][1]);
          }

          // Update display values for quat group
          for (var g = 0; g < quatGroups.length; g++) {
            for (var qi = quatGroups[g][0]; qi < quatGroups[g][1]; qi++) {
              var valEl = document.getElementById('jval-' + entityIdx + '-' + qi);
              if (valEl) valEl.textContent = qpos[qi].toFixed(3);
              // Update the input value too
              var inp = entityBrowser.querySelector('.quat-input[data-entity-idx="' + entityIdx + '"][data-q-idx="' + qi + '"]');
              if (inp && inp !== this) inp.value = qpos[qi].toFixed(4);
            }
          }
          // Update this input
          this.value = qpos[qIdx].toFixed(4);
          var valEl = document.getElementById('jval-' + entityIdx + '-' + qIdx);
          if (valEl) valEl.textContent = qpos[qIdx].toFixed(3);

          // Update cached qpos
          entity.qpos = qpos;

          send({
            type: 'entity_update',
            entity_idx: entityIdx,
            qpos: qpos,
            normalize_quats: true,
            quat_groups: quatGroups
          });
        });
      });
    }

    // ---- Euler Input Listeners ----
    function attachEulerInputListeners() {
      // Position inputs in euler mode
      entityBrowser.querySelectorAll('.euler-pos-input').forEach(function(input) {
        input.addEventListener('change', function() {
          var entityIdx = parseInt(this.dataset.entityIdx);
          var qIdx = parseInt(this.dataset.qIdx);
          var value = parseFloat(this.value);

          autoPause();

          send({
            type: 'entity_update',
            entity_idx: entityIdx,
            dof_idx: qIdx,
            value: value
          });
        });
      });

      // Euler angle inputs
      entityBrowser.querySelectorAll('.euler-angle-input').forEach(function(input) {
        input.addEventListener('change', function() {
          var entityIdx = parseInt(this.dataset.entityIdx);
          var eulerKey = this.dataset.eulerKey;
          var value = parseFloat(this.value);

          var entity = findEntity(entityIdx);
          if (!entity) return;

          autoPause();

          // Update stored euler
          entityState[entityIdx].euler[eulerKey] = value;

          var st = entityState[entityIdx];
          var q = eulerToQuat(st.euler.roll, st.euler.pitch, st.euler.yaw);

          // Build full qpos
          var qpos = (entity.qpos || []).slice();
          var quatGroups = entity.quat_groups || [];
          if (quatGroups.length > 0) {
            var qg = quatGroups[0];
            qpos[qg[0]] = q.w;
            qpos[qg[0] + 1] = q.x;
            qpos[qg[0] + 2] = q.y;
            qpos[qg[0] + 3] = q.z;
          }

          // Also read current position values from inputs
          var freeStart = entity.free_joint_q_start || 0;
          var posInputs = entityBrowser.querySelectorAll('.euler-pos-input[data-entity-idx="' + entityIdx + '"]');
          posInputs.forEach(function(pi) {
            qpos[parseInt(pi.dataset.qIdx)] = parseFloat(pi.value);
          });

          // Also read remaining joint sliders
          var eulerSliders = entityBrowser.querySelectorAll('.euler-joint-slider[data-entity-idx="' + entityIdx + '"]');
          eulerSliders.forEach(function(sl) {
            qpos[parseInt(sl.dataset.qIdx)] = parseFloat(sl.value);
          });

          entity.qpos = qpos;

          send({
            type: 'entity_update',
            entity_idx: entityIdx,
            qpos: qpos,
            normalize_quats: true,
            quat_groups: quatGroups
          });
        });
      });
    }

    // ---- Gizmo Button Listeners ----
    function attachGizmoListeners() {
      entityBrowser.querySelectorAll('.gizmo-toggle-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          toggleGizmo(parseInt(this.dataset.entityIdx));
        });
      });
      entityBrowser.querySelectorAll('.gizmo-mode-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          setGizmoMode(this.dataset.gizmoMode);
        });
      });
    }

    // ---- Find entity by idx ----
    function findEntity(entityIdx) {
      for (var i = 0; i < sceneEntities.length; i++) {
        var idx = sceneEntities[i].idx != null ? sceneEntities[i].idx : i;
        if (idx === entityIdx) return sceneEntities[i];
      }
      return null;
    }

    // ---- Update Entity States from Server ----
    function updateEntityStates(entities) {
      entities.forEach(function(entity, arrIdx) {
        var entityIdx = entity.idx != null ? entity.idx : arrIdx;
        if (!entity.qpos) return;

        // Update cached qpos
        var cached = findEntity(entityIdx);
        if (cached) cached.qpos = entity.qpos.slice();

        entity.qpos.forEach(function(val, qIdx) {
          // Update quat mode value displays and sliders
          var valEl = document.getElementById('jval-' + entityIdx + '-' + qIdx);
          if (valEl) valEl.textContent = val.toFixed(3);

          var slider = entityBrowser.querySelector('.joint-slider[data-entity-idx="' + entityIdx + '"][data-q-idx="' + qIdx + '"]');
          if (slider && document.activeElement !== slider) {
            slider.value = val;
          }

          var quatInput = entityBrowser.querySelector('.quat-input[data-entity-idx="' + entityIdx + '"][data-q-idx="' + qIdx + '"]');
          if (quatInput && document.activeElement !== quatInput) {
            quatInput.value = val.toFixed(4);
          }

          // Update euler mode value displays and sliders
          var eulerValEl = document.getElementById('euler-jval-' + entityIdx + '-' + qIdx);
          if (eulerValEl) eulerValEl.textContent = val.toFixed(3);

          var eulerSlider = entityBrowser.querySelector('.euler-joint-slider[data-entity-idx="' + entityIdx + '"][data-q-idx="' + qIdx + '"]');
          if (eulerSlider && document.activeElement !== eulerSlider) {
            eulerSlider.value = val;
          }

          // Update euler position inputs
          var posInput = entityBrowser.querySelector('.euler-pos-input[data-entity-idx="' + entityIdx + '"][data-q-idx="' + qIdx + '"]');
          if (posInput && document.activeElement !== posInput) {
            posInput.value = val.toFixed(2);
          }
        });

        // Update euler angle displays from quaternion
        if (cached && cached.has_free_joint && cached.quat_groups && cached.quat_groups.length > 0) {
          var qg = cached.quat_groups[0];
          var qw = entity.qpos[qg[0]] || 1;
          var qx = entity.qpos[qg[0] + 1] || 0;
          var qy = entity.qpos[qg[0] + 2] || 0;
          var qz = entity.qpos[qg[0] + 3] || 0;
          var euler = quatToEuler(qw, qx, qy, qz);

          if (entityState[entityIdx]) {
            entityState[entityIdx].euler = euler;
          }

          // Update euler angle inputs if not focused
          var eulerInputs = entityBrowser.querySelectorAll('.euler-angle-input[data-entity-idx="' + entityIdx + '"]');
          eulerInputs.forEach(function(inp) {
            if (document.activeElement !== inp) {
              var key = inp.dataset.eulerKey;
              inp.value = euler[key].toFixed(1);
            }
          });
        }
      });
    }

    // ---- Utility ----
    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ---- Start ----
    connect();
  </script>
</body>
</html>
